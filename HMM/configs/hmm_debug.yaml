project:
  seed: 42

paths:
  train_dataset: data/processed/tensors/train_dataset.pt
  val_dataset: data/processed/tensors/val_dataset.pt
  test_dataset: data/processed/tensors/test_dataset.pt
  output_dir: HMM/outputs
  match_dir: HMM/outputs/matches
  metric_dir: HMM/outputs/metrics
  report_dir: HMM/outputs/reports

decode:
  split: val
  transition_mode: soft
  confidence_temperature: 1.0

emission:
  distance_weight: 2.0
  yaw_weight: 1.0
  rank_weight: 0.7
  speed_consistency_weight: 0.2
  oneway_weight: 0.1
  bias: 0.0

transition:
  legal_bonus: 1.0
  illegal_penalty: 8.0
  same_edge_bonus: 1.0
  same_osm_way_bonus: 0.5
  same_road_class_bonus: 0.15
  route_distance_weight: 0.8
  route_gps_ratio_weight: 0.4
  turn_weight: 0.3
  yaw_change_weight: 0.1
  time_feasible_bonus: 0.3
  time_infeasible_penalty: 2.0
  rank_delta_weight: 0.15
  distance_delta_weight: 0.15

evaluation:
  projection_threshold_m: 10.0
  trajectory_success_accuracy: 0.90

grid_search:
  split: val
  distance_weight: [1.0, 1.5, 2.0, 2.5]
  yaw_weight: [0.5, 1.0, 1.5]
  rank_weight: [0.3, 0.7, 1.0]
  legal_bonus: [0.5, 1.0, 1.5]
  illegal_penalty: [4.0, 8.0, 12.0]
  same_edge_bonus: [0.5, 1.0, 1.5]
  route_distance_weight: [0.4, 0.8, 1.2]
  max_trials: 20
