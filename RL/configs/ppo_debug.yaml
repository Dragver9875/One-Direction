project:
  seed: 42
  device: auto

paths:
  train_dataset: data/processed/tensors/train_dataset.pt
  val_dataset: data/processed/tensors/val_dataset.pt
  test_dataset: data/processed/tensors/test_dataset.pt
  output_dir: RL/outputs
  checkpoint_dir: RL/outputs/checkpoints
  report_dir: RL/outputs/reports
  metric_dir: RL/outputs/metrics
  match_dir: RL/outputs/matches

features:
  use_privileged_critic: true
  max_candidates: null

reward:
  correct_action_reward: 1.0
  wrong_action_penalty: -0.2
  invalid_action_penalty: -2.0
  legal_transition_bonus: 0.2
  illegal_transition_penalty: -1.0
  projection_error_weight: 0.02
  projection_error_cap_m: 25.0
  terminal_success_accuracy: 0.90
  terminal_success_bonus: 2.0
  terminal_accuracy_weight: 1.0
  terminal_illegal_transition_weight: 0.2

model:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.1

bc:
  enabled: true
  epochs: 2
  batch_size: 512
  lr: 0.001
  checkpoint: RL/outputs/checkpoints/bc_actor.pt

ppo:
  epochs: 3
  episodes_per_epoch: 20
  update_epochs: 4
  minibatch_size: 512
  gamma: 0.98
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_lr: 0.0003
  critic_lr: 0.0003
  entropy_coef: 0.01
  value_coef: 0.5
  grad_clip_norm: 5.0
  load_bc_checkpoint: true

evaluation:
  split: test
  greedy: true
