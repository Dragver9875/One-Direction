project:
  name: One-Direction
  version: 0.1.0
  seed: 42
  deterministic: true
  device: auto 

paths:
  root: .
  data_dir: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: data/reports
  outputs_dir: outputs
  checkpoint_dir: outputs/checkpoints
  figure_dir: outputs/figures
  metrics_dir: outputs/metrics
  matches_dir: outputs/matches

logging:
  level: INFO
  log_to_file: true
  log_file: outputs/one_direction.log

runtime:
  num_workers: 4
  pin_memory: true
  progress_bar: true